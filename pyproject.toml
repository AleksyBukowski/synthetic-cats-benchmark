[project]
name = "catbench"
version = "0.1.0"
description = "Synthetic data generation with diffusion models: Oxford-IIIT Pet cat-breed benchmark"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "pillow",
    "tqdm",
    "tabulate",
    "jupyterlab",
    "ipykernel",
]

# PyTorch comes in two interchangeable builds (pick one):
#   uv sync                                   -> "gpu" (default): CUDA 12.8 build, ~2.5 GB, also runs on CPU
#   uv sync --no-default-groups --group cpu   -> "cpu": CPU-only build, much smaller download
[dependency-groups]
gpu = ["torch>=2.7", "torchvision>=0.22"]
cpu = ["torch==2.11.*", "torchvision==0.26.*"]   # same versions as the gpu build

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catbench"]

[tool.uv]
default-groups = ["gpu"]
conflicts = [[{ group = "gpu" }, { group = "cpu" }]]

# On macOS both groups use the normal PyPI build (there is no CUDA there).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", group = "gpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", group = "gpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
