[project]
name = "catbench"
version = "0.1.0"
description = "Synthetic data generation with diffusion models: Oxford-IIIT Pet cat-breed benchmark"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "numpy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "pillow",
    "tqdm",
    "tabulate",
    "jupyterlab",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catbench"]

# On Windows and Linux, take PyTorch from the official CUDA 12.8 index.
# These wheels also run on machines without an NVIDIA GPU (they fall back to CPU),
# so the same lock file works on a laptop, a lab PC, or a GPU workstation.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
